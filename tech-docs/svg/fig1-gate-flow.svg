<svg xmlns="http://www.w3.org/2000/svg" width="740" height="880" font-family="Microsoft YaHei">
  <!-- 列标题 -->
  <rect x="40" y="20" width="260" height="32" rx="16" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.4"/>
  <text x="170" y="42" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">注册支路（一次性）</text>
  <rect x="430" y="20" width="270" height="32" rx="16" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="565" y="42" font-size="15" font-weight="700" fill="#2B6CB0" text-anchor="middle">监听支路（持续运行）</text>

  <!-- 左列：注册（中心 x=170） -->
  <rect x="40" y="72" width="260" height="56" rx="10" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="170" y="105" font-size="13.5" fill="#1F2933" text-anchor="middle">注册语音（现场说一句话）</text>
  <rect x="40" y="168" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.6"/>
  <text x="170" y="194" font-size="13" fill="#1F2933" text-anchor="middle">独立 VAD 剥静音</text>
  <text x="170" y="216" font-size="13" fill="#1F2933" text-anchor="middle">净语音累计（目标 1.2 s）</text>
  <polygon points="170,250 277,296 170,342 63,296" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="170" y="294" font-size="13" fill="#1F2933" text-anchor="middle">净语音够了？</text>
  <text x="170" y="314" font-size="10.5" fill="#4A5568" text-anchor="middle">不足 0.6 s：再说一句</text>
  <rect x="40" y="430" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <text x="170" y="456" font-size="12.5" fill="#1F2933" text-anchor="middle">ER2Net 嵌入 r（512 维）</text>
  <text x="170" y="478" font-size="12.5" fill="#4A5568" text-anchor="middle">式(9)~(14)：外置知识</text>
  <rect x="40" y="568" width="260" height="64" rx="10" fill="#E9F7EE" stroke="#2F855A" stroke-width="1.6"/>
  <text x="170" y="594" font-size="12.5" fill="#1F2933" text-anchor="middle">L2 归一化（式 16）</text>
  <text x="170" y="616" font-size="12.5" fill="#1F2933" text-anchor="middle">保存注册声纹 r̂</text>

  <!-- 左列注释卡：解释双 VAD 实例，补齐左下空白 -->
  <rect x="40" y="660" width="260" height="88" rx="10" fill="#F5F7FA" stroke="#718096" stroke-width="1.3" stroke-dasharray="6,5"/>
  <text x="170" y="686" font-size="12.5" font-weight="700" fill="#1F2933" text-anchor="middle">两条支路各用独立 VAD 实例</text>
  <text x="170" y="708" font-size="11.5" fill="#4A5568" text-anchor="middle">模型内部有记忆状态，</text>
  <text x="170" y="726" font-size="11.5" fill="#4A5568" text-anchor="middle">共用会互相污染切段状态</text>
  <text x="170" y="744" font-size="11" fill="#718096" text-anchor="middle">（2.2 节）</text>

  <!-- 右列：监听（中心 x=565） -->
  <rect x="420" y="362" width="292" height="302" rx="8" fill="none" stroke="#B7791F" stroke-width="1.3" stroke-dasharray="6,5"/>
  <text x="712" y="356" font-size="11.5" fill="#B7791F" text-anchor="end">整段判定（式 15~18）</text>
  <rect x="430" y="72" width="270" height="56" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="565" y="105" font-size="13.5" fill="#1F2933" text-anchor="middle">连续音频流 16 kHz（128 ms 帧）</text>
  <rect x="430" y="168" width="270" height="64" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="565" y="194" font-size="13" fill="#1F2933" text-anchor="middle">VAD 切段（式 2）</text>
  <text x="565" y="216" font-size="13" fill="#1F2933" text-anchor="middle">160 ms 小块喂入</text>
  <rect x="430" y="280" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="565" y="305" font-size="12.5" fill="#1F2933" text-anchor="middle">段状态机：0.1 s 开 / 0.3 s 闭</text>
  <text x="565" y="325" font-size="12.5" fill="#1F2933" text-anchor="middle">15 s 强切</text>
  <rect x="430" y="372" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <text x="565" y="405" font-size="13" fill="#1F2933" text-anchor="middle">完结段 → ER2Net 嵌入 q</text>
  <rect x="430" y="456" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <text x="565" y="489" font-size="13" fill="#1F2933" text-anchor="middle">相似度 cos(q, r̂)（式 15）</text>
  <polygon points="565,552 667,600 565,648 463,600" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="565" y="596" font-size="13" fill="#1F2933" text-anchor="middle">≥ 阈值 T ？</text>
  <text x="565" y="618" font-size="12" fill="#4A5568" text-anchor="middle">式(17)(18)</text>
  <rect x="430" y="688" width="170" height="60" rx="10" fill="#E9F7EE" stroke="#2F855A" stroke-width="1.6"/>
  <text x="515" y="713" font-size="12.5" fill="#1F2933" text-anchor="middle">放行 → 送流式识别</text>
  <text x="515" y="735" font-size="12.5" fill="#1F2933" text-anchor="middle">（出字幕）</text>
  <rect x="628" y="688" width="98" height="60" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.6"/>
  <text x="677" y="723" font-size="13" fill="#1F2933" text-anchor="middle">丢弃</text>

  <!-- 左列箭头（尖端停在目标边线前 4px） -->
  <line x1="170" y1="128" x2="170" y2="164" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="163,153 177,153 170,164" fill="#94A3B8"/>
  <line x1="170" y1="232" x2="170" y2="246" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="163,235 177,235 170,246" fill="#94A3B8"/>
  <line x1="170" y1="342" x2="170" y2="426" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="163,415 177,415 170,426" fill="#94A3B8"/>
  <text x="182" y="388" font-size="11.5" fill="#2F855A" text-anchor="start">足够</text>
  <line x1="170" y1="494" x2="170" y2="564" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="163,553 177,553 170,564" fill="#94A3B8"/>

  <!-- 右列箭头 -->
  <line x1="565" y1="128" x2="565" y2="164" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,153 572,153 565,164" fill="#94A3B8"/>
  <line x1="565" y1="232" x2="565" y2="276" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,265 572,265 565,276" fill="#94A3B8"/>
  <line x1="565" y1="336" x2="565" y2="368" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,357 572,357 565,368" fill="#94A3B8"/>
  <line x1="565" y1="428" x2="565" y2="452" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,441 572,441 565,452" fill="#94A3B8"/>
  <line x1="565" y1="512" x2="565" y2="548" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,537 572,537 565,548" fill="#94A3B8"/>
  <polyline points="545,639 515,639 515,673" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="508,673 522,673 515,684" fill="#94A3B8"/>
  <text x="505" y="668" font-size="11.5" fill="#2F855A" text-anchor="end" data-halo="1">是</text>
  <polyline points="585,639 677,639 677,673" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="670,673 684,673 677,684" fill="#94A3B8"/>
  <text x="688" y="664" font-size="11.5" fill="#C53030" text-anchor="start" data-halo="1">否</text>

  <!-- 注册声纹汇入判定：L2 归一化盒与菱形左顶点同高（y=600），一条直线直达 -->
  <line x1="300" y1="600" x2="451" y2="600" stroke="#2F855A" stroke-width="1.6" stroke-dasharray="6,5"/>
  <polygon points="451,594 451,606 462,600" fill="#2F855A"/>
  <text x="376" y="574" font-size="11.5" fill="#2F855A" text-anchor="middle" data-halo="1">注册声纹</text>
  <text x="376" y="592" font-size="11.5" fill="#2F855A" text-anchor="middle" data-halo="1">全程复用</text>

  <!-- 底部说明带 -->
  <rect x="40" y="768" width="686" height="92" rx="10" fill="#F5F7FA" stroke="#718096" stroke-width="1.4"/>
  <text x="58" y="794" font-size="12.5" font-weight="700" fill="#1F2933" text-anchor="start">流式模式（打字机字幕）—— 替代右列虚线区内的整段判定：</text>
  <text x="58" y="816" font-size="12" fill="#4A5568" text-anchor="start">500 ms 步长 · 1 s 滑窗 · EMA 平滑（式 20~22）· 独立阈值 0.25，过则该块立即送识别</text>
  <text x="58" y="840" font-size="11.5" fill="#718096" text-anchor="start">另：未注册时监听支路恒放行——没有目标时不拦截一切（2.5 节）；图中 r̂ 即归一化后的注册嵌入</text>
</svg>
