<svg xmlns="http://www.w3.org/2000/svg" width="740" height="770" font-family="Microsoft YaHei">
  <!-- 输入 -->
  <rect x="140" y="20" width="340" height="64" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <text x="310" y="45" font-size="13" fill="#1F2933" text-anchor="middle">第 k 个 0.5 s 子窗：同段的 ŝ 与 y</text>
  <text x="310" y="67" font-size="11.5" fill="#718096" text-anchor="middle">（能量基准取全部子窗 RMS 的 p95）</text>

  <!-- 四道门（菱形，中心 x=310） -->
  <polygon points="310,108 425,150 310,192 195,150" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="310" y="145" font-size="13" fill="#1F2933" text-anchor="middle">能量门</text>
  <text x="310" y="166" font-size="12" fill="#4A5568" text-anchor="middle">RMS(ŝ) &lt; 0.15×p95 ?</text>
  <text x="185" y="154" font-size="11" fill="#718096" text-anchor="end">拦：目标未说话，ŝ 是静音垃圾</text>

  <polygon points="310,238 425,280 310,322 195,280" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="310" y="275" font-size="13" fill="#1F2933" text-anchor="middle">相关门</text>
  <text x="310" y="296" font-size="12" fill="#4A5568" text-anchor="middle">|corr(ŝ, y)| &lt; 0.40 ?</text>
  <text x="185" y="284" font-size="11" fill="#718096" text-anchor="end">拦：估计与混音不相关</text>

  <polygon points="310,368 425,410 310,452 195,410" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="310" y="405" font-size="13" fill="#1F2933" text-anchor="middle">增益帽</text>
  <text x="310" y="426" font-size="12" fill="#4A5568" text-anchor="middle">|γ̂| &gt; 15 ?</text>
  <text x="185" y="414" font-size="11" fill="#718096" text-anchor="end">拦：最小二乘数值发散</text>

  <polygon points="310,498 425,540 310,582 195,540" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="310" y="535" font-size="13" fill="#1F2933" text-anchor="middle">声纹门（自一致性）</text>
  <text x="310" y="556" font-size="12" fill="#4A5568" text-anchor="middle">cos(ŝ 邻域, r) &lt; 0.12 ?</text>
  <text x="185" y="544" font-size="11" fill="#718096" text-anchor="end">拦：ŝ 不含注册人（混音副本）</text>

  <!-- 通过（绿） -->
  <rect x="170" y="638" width="280" height="64" rx="10" fill="#E9F7EE" stroke="#2F855A" stroke-width="1.6"/>
  <text x="310" y="662" font-size="13" fill="#1F2933" text-anchor="middle">该子窗按对齐增益相减</text>
  <text x="310" y="684" font-size="12.5" fill="#4A5568" text-anchor="middle">γ = (ŝ, y) / (ŝ, ŝ)（最小二乘，带符号）</text>
  <text x="310" y="736" font-size="12" fill="#718096" text-anchor="middle">全部子窗判定后：中心插值 → 0.1 s 平滑 → 逐采样 γ(t)</text>

  <!-- 不通过（红）：四条否分支汇入 -->
  <rect x="470" y="388" width="250" height="100" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.6"/>
  <text x="595" y="416" font-size="13" fill="#1F2933" text-anchor="middle">该子窗不减（γ 置零）</text>
  <text x="595" y="438" font-size="12.5" fill="#4A5568" text-anchor="middle">宁可不减，不可错减</text>
  <text x="595" y="460" font-size="11.5" fill="#718096" text-anchor="middle">防他人独唱被误消除</text>

  <!-- 主链（是） -->
  <line x1="310" y1="84" x2="310" y2="104" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="303,93 317,93 310,104" fill="#94A3B8"/>
  <line x1="310" y1="192" x2="310" y2="234" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="303,223 317,223 310,234" fill="#94A3B8"/>
  <text x="322" y="218" font-size="11.5" fill="#2F855A" text-anchor="start" data-halo="1">是</text>
  <line x1="310" y1="322" x2="310" y2="364" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="303,353 317,353 310,364" fill="#94A3B8"/>
  <text x="322" y="348" font-size="11.5" fill="#2F855A" text-anchor="start" data-halo="1">是</text>
  <line x1="310" y1="452" x2="310" y2="494" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="303,483 317,483 310,494" fill="#94A3B8"/>
  <text x="322" y="478" font-size="11.5" fill="#2F855A" text-anchor="start" data-halo="1">是</text>
  <line x1="310" y1="582" x2="310" y2="634" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="303,623 317,623 310,634" fill="#94A3B8"/>
  <text x="322" y="618" font-size="11.5" fill="#2F855A" text-anchor="start" data-halo="1">是</text>

  <!-- 否分支（红，汇入右侧红框） -->
  <polyline points="425,150 448,150 448,402 466,402" fill="none" stroke="#C53030" stroke-width="1.4"/>
  <polygon points="456,397 456,407 466,402" fill="#C53030"/>
  <text x="434" y="144" font-size="11" fill="#C53030" text-anchor="start" data-halo="1">否</text>
  <polyline points="425,280 458,280 458,424 466,424" fill="none" stroke="#C53030" stroke-width="1.4"/>
  <polygon points="456,419 456,429 466,424" fill="#C53030"/>
  <text x="434" y="274" font-size="11" fill="#C53030" text-anchor="start" data-halo="1">否</text>
  <polyline points="425,410 447,410 447,446 466,446" fill="none" stroke="#C53030" stroke-width="1.4"/>
  <polygon points="456,441 456,451 466,446" fill="#C53030"/>
  <text x="434" y="404" font-size="11" fill="#C53030" text-anchor="start" data-halo="1">否</text>
  <polyline points="425,540 448,540 448,468 466,468" fill="none" stroke="#C53030" stroke-width="1.4"/>
  <polygon points="456,463 456,473 466,468" fill="#C53030"/>
  <text x="434" y="534" font-size="11" fill="#C53030" text-anchor="start" data-halo="1">否</text>
</svg>
