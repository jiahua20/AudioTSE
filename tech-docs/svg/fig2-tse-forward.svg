<svg xmlns="http://www.w3.org/2000/svg" width="780" height="960" font-family="Microsoft YaHei">
  <rect x="64" y="36" width="400" height="54" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="264" y="68" font-size="13.5" fill="#1F2933" text-anchor="middle">混合窗 x(n)：1 s = 16000 采样</text>

  <rect x="64" y="124" width="400" height="54" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <circle cx="88" cy="151" r="12" fill="#F5F7FA" stroke="#4A5568" stroke-width="1.4"/>
  <text x="88" y="155" font-size="11.5" font-weight="700" fill="#4A5568" text-anchor="middle">1</text>
  <text x="112" y="156" font-size="13" fill="#1F2933" text-anchor="start">STFT（式 29）：N=512 / R=128</text>

  <rect x="64" y="208" width="400" height="66" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <text x="264" y="235" font-size="13" fill="#1F2933" text-anchor="middle">复数谱 X(f,t)：257 频点 × 126 帧</text>
  <text x="264" y="258" font-size="12.5" fill="#4A5568" text-anchor="middle">（实部/虚部双通道入网络）</text>

  <rect x="64" y="310" width="400" height="66" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <circle cx="88" cy="343" r="12" fill="#F5F7FA" stroke="#4A5568" stroke-width="1.4"/>
  <text x="88" y="348" font-size="11.5" font-weight="700" fill="#4A5568" text-anchor="middle">2</text>
  <text x="112" y="337" font-size="13" fill="#1F2933" text-anchor="start">频带分割（式 30）：32 带</text>
  <text x="112" y="359" font-size="12.5" fill="#4A5568" text-anchor="start">低频细分、高频粗分</text>

  <rect x="64" y="412" width="400" height="54" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <circle cx="88" cy="439" r="12" fill="#F5F7FA" stroke="#4A5568" stroke-width="1.4"/>
  <text x="88" y="444" font-size="11.5" font-weight="700" fill="#4A5568" text-anchor="middle">3</text>
  <text x="112" y="444" font-size="12.5" fill="#1F2933" text-anchor="start">逐带归一化 → 每带 128 维（式 31~32）</text>

  <rect x="64" y="500" width="400" height="78" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <circle cx="88" cy="539" r="12" fill="#F5F7FA" stroke="#4A5568" stroke-width="1.4"/>
  <text x="88" y="544" font-size="11.5" font-weight="700" fill="#4A5568" text-anchor="middle">4</text>
  <text x="112" y="531" font-size="13" fill="#1F2933" text-anchor="start">分离器：带内（时间）与带间（频带）</text>
  <text x="112" y="553" font-size="12.5" fill="#4A5568" text-anchor="start">注意力交替 ×6（式 33~34）——外置知识</text>

  <rect x="64" y="614" width="400" height="62" rx="10" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <circle cx="88" cy="645" r="12" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.4"/>
  <text x="88" y="650" font-size="11.5" font-weight="700" fill="#B7791F" text-anchor="middle">5</text>
  <text x="112" y="638" font-size="13" fill="#1F2933" text-anchor="start">掩码 M = A ⊙ sigmoid(B)（式 37）</text>
  <text x="112" y="660" font-size="12.5" fill="#4A5568" text-anchor="start">天然有界 |M| ≤ |A|</text>

  <rect x="64" y="708" width="400" height="54" rx="10" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="264" y="740" font-size="13" fill="#1F2933" text-anchor="middle">复数乘：估计谱 = X · M（式 38~39）</text>

  <rect x="64" y="794" width="400" height="54" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <circle cx="88" cy="821" r="12" fill="#F5F7FA" stroke="#4A5568" stroke-width="1.4"/>
  <text x="88" y="826" font-size="11.5" font-weight="700" fill="#4A5568" text-anchor="middle">6</text>
  <text x="112" y="826" font-size="13" fill="#1F2933" text-anchor="start">iSTFT（式 41）</text>

  <rect x="64" y="880" width="400" height="54" rx="10" fill="#E9F7EE" stroke="#2F855A" stroke-width="1.6"/>
  <text x="264" y="912" font-size="13.5" font-weight="700" fill="#1F2933" text-anchor="middle">目标说话人波形估计</text>

  <!-- 主链箭头（尖端停在目标边线） -->
  <line x1="264" y1="90" x2="264" y2="113" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,113 271,113 264,124" fill="#94A3B8"/>
  <line x1="264" y1="178" x2="264" y2="197" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,197 271,197 264,208" fill="#94A3B8"/>
  <line x1="264" y1="274" x2="264" y2="299" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,299 271,299 264,310" fill="#94A3B8"/>
  <line x1="264" y1="376" x2="264" y2="401" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,401 271,401 264,412" fill="#94A3B8"/>
  <line x1="264" y1="466" x2="264" y2="489" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,489 271,489 264,500" fill="#94A3B8"/>
  <line x1="264" y1="578" x2="264" y2="603" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,603 271,603 264,614" fill="#94A3B8"/>
  <line x1="264" y1="676" x2="264" y2="697" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,697 271,697 264,708" fill="#94A3B8"/>
  <line x1="264" y1="762" x2="264" y2="783" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,783 271,783 264,794" fill="#94A3B8"/>
  <line x1="264" y1="848" x2="264" y2="869" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="257,869 271,869 264,880" fill="#94A3B8"/>

  <!-- 注册嵌入注入 -->
  <rect x="520" y="330" width="196" height="100" rx="10" fill="#E9F7EE" stroke="#2F855A" stroke-width="1.6" stroke-dasharray="7,5"/>
  <text x="618" y="360" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">注册嵌入 r（192 维）</text>
  <text x="618" y="384" font-size="12.5" fill="#1F2933" text-anchor="middle">缓存注入（式 27~28）</text>
  <text x="618" y="406" font-size="12.5" fill="#4A5568" text-anchor="middle">只算一次、逐窗复用</text>
  <polyline points="520,380 484,380 484,539 467,539" fill="none" stroke="#2F855A" stroke-width="1.6" stroke-dasharray="7,5"/>
  <polygon points="467,533 467,545 456,539" fill="#2F855A"/>
  <text x="484" y="452" font-size="11.5" fill="#2F855A" text-anchor="middle" data-halo="1">乘性门控</text>
  <text x="484" y="470" font-size="11.5" fill="#2F855A" text-anchor="middle" data-halo="1">g ⊙ Q（式 35~36）</text>

  <!-- 复数谱旁路：沿最右侧绕行，不与任何文字/框交叉 -->
  <polyline points="464,241 756,241 756,735 470,735" fill="none" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="7,5"/>
  <polygon points="470,729 470,741 459,735" fill="#B7791F"/>
  <text x="645" y="640" font-size="12" font-weight="700" fill="#B7791F" text-anchor="middle">复数谱旁路</text>
  <text x="645" y="662" font-size="11.5" fill="#B7791F" text-anchor="middle">掩码乘的是真实观测，</text>
  <text x="645" y="684" font-size="11.5" fill="#B7791F" text-anchor="middle">不是网络的中间特征</text>

  <!-- 外置知识备注 -->
  <text x="618" y="458" font-size="11.5" fill="#718096" text-anchor="middle">④ 分离器与掩码头的线性层</text>
  <text x="618" y="478" font-size="11.5" fill="#718096" text-anchor="middle">都在预训练权重内部</text>
  <text x="618" y="498" font-size="11.5" fill="#718096" text-anchor="middle">（外置知识）</text>
</svg>
