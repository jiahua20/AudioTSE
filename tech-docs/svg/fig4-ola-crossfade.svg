<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" font-family="Microsoft YaHei">
  <rect x="260" y="120" width="120" height="80" fill="#FCF0DA"/>
  <line x1="60" y1="200" x2="640" y2="200" stroke="#718096" stroke-width="1.6"/>
  <polygon points="640,193 640,207 656,200" fill="#718096"/>
  <polygon points="60,200 110,120 330,120 380,200" fill="none" stroke="#2B6CB0" stroke-width="2.4"/>
  <polygon points="260,200 310,120 530,120 580,200" fill="none" stroke="#2F855A" stroke-width="2.4"/>
  <text x="185" y="106" font-size="13" font-weight="700" fill="#2B6CB0" text-anchor="middle">窗 k（淡出 1→0）</text>
  <text x="485" y="106" font-size="13" font-weight="700" fill="#2F855A" text-anchor="middle">窗 k+1（淡入 0→1）</text>
  <text x="320" y="228" font-size="13" font-weight="700" fill="#B7791F" text-anchor="middle">重叠区 C = 1600</text>
  <text x="320" y="248" font-size="12.5" fill="#B7791F" text-anchor="middle" data-halo="1">(1−r) + r = 1（式 44）</text>

  <!-- 尺寸标注：窗长 W -->
  <line x1="68" y1="286" x2="372" y2="286" stroke="#4A5568" stroke-width="1.3"/>
  <polygon points="60,286 74,279 74,293" fill="#4A5568"/>
  <polygon points="380,286 366,279 366,293" fill="#4A5568"/>
  <text x="220" y="278" font-size="12" fill="#4A5568" text-anchor="middle" data-halo="1">窗长 W = 16000（1 s）</text>
  <!-- 尺寸标注：步长 H 与交叉淡化 C -->
  <line x1="68" y1="336" x2="252" y2="336" stroke="#4A5568" stroke-width="1.3"/>
  <polygon points="60,336 74,329 74,343" fill="#4A5568"/>
  <polygon points="260,336 246,329 246,343" fill="#4A5568"/>
  <text x="160" y="328" font-size="12" fill="#4A5568" text-anchor="middle" data-halo="1">步长 H = 14400（0.9 s）</text>
  <line x1="268" y1="336" x2="372" y2="336" stroke="#B7791F" stroke-width="1.3"/>
  <polygon points="260,336 274,329 274,343" fill="#B7791F"/>
  <polygon points="380,336 366,329 366,343" fill="#B7791F"/>
  <text x="320" y="328" font-size="12" fill="#B7791F" text-anchor="middle" data-halo="1">交叉淡化 C</text>
  <!-- 竖直引线（缩短，不穿标签） -->
  <line x1="60" y1="268" x2="60" y2="204" stroke="#718096" stroke-width="1.2"/>
  <line x1="260" y1="256" x2="260" y2="204" stroke="#B7791F" stroke-width="1.2"/>
  <line x1="380" y1="256" x2="380" y2="204" stroke="#B7791F" stroke-width="1.2"/>

  <rect x="428" y="252" width="262" height="104" rx="8" fill="#F5F7FA" stroke="#718096" stroke-width="1.3"/>
  <text x="444" y="280" font-size="12" fill="#4A5568" text-anchor="start">两窗对同一段音频的估计略有差异，</text>
  <text x="444" y="302" font-size="12" fill="#4A5568" text-anchor="start">重叠区输出 = (1−r)·窗k + r·窗k+1，</text>
  <text x="444" y="324" font-size="12" fill="#4A5568" text-anchor="start">凸组合平滑过渡 ——「无缝」（式 45）</text>
</svg>
