<svg xmlns="http://www.w3.org/2000/svg" width="808" height="852" font-family="Microsoft YaHei">
  <!-- 列标题 -->
  <rect x="40" y="20" width="260" height="32" rx="16" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.4"/>
  <text x="170" y="42" font-size="15" font-weight="700" fill="#B7791F" text-anchor="middle">注册支路（一次性）</text>
  <rect x="435" y="20" width="260" height="32" rx="16" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="565" y="42" font-size="15" font-weight="700" fill="#2B6CB0" text-anchor="middle">混音支路（整段处理）</text>

  <!-- 左列：注册（中心 x=170） -->
  <rect x="40" y="72" width="260" height="52" rx="10" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="170" y="103" font-size="13.5" fill="#1F2933" text-anchor="middle">注册音频（目标人，≥ 3 s）</text>
  <rect x="40" y="156" width="260" height="52" rx="10" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.6"/>
  <text x="170" y="187" font-size="13" fill="#1F2933" text-anchor="middle">解码 → 16 kHz 单声道 PCM</text>
  <rect x="40" y="240" width="260" height="64" rx="10" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="170" y="266" font-size="12.5" fill="#1F2933" text-anchor="middle">ECAPA 说话人嵌入 r（192 维）</text>
  <text x="170" y="288" font-size="12.5" fill="#4A5568" text-anchor="middle">只算一次，全程缓存复用</text>

  <!-- 右列：混音（中心 x=565） -->
  <rect x="435" y="72" width="260" height="52" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="565" y="103" font-size="13.5" fill="#1F2933" text-anchor="middle">混音 y（多人说话、可重叠）</text>
  <rect x="435" y="156" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="565" y="182" font-size="13" fill="#1F2933" text-anchor="middle">解码 → 16 kHz 单声道 PCM</text>
  <text x="565" y="204" font-size="12.5" fill="#4A5568" text-anchor="middle">按 2048 采样小块喂入</text>
  <rect x="435" y="248" width="260" height="76" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="565" y="274" font-size="13" fill="#1F2933" text-anchor="middle">流式目标提取（窗长可注入）</text>
  <text x="565" y="295" font-size="12.5" fill="#4A5568" text-anchor="middle">离线 2 s 窗 / 实时 1 s 窗</text>
  <text x="565" y="314" font-size="12.5" fill="#4A5568" text-anchor="middle">OLA 交叉淡化 + 静音旁路</text>
  <rect x="435" y="356" width="260" height="52" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="565" y="387" font-size="13" fill="#1F2933" text-anchor="middle">目标贡献估计 ŝ（相位对齐）</text>

  <!-- 合并处理段（中心 x=370，x=140 w=460） -->
  <rect x="140" y="448" width="460" height="76" rx="10" fill="#FFF8E7" stroke="#B7791F" stroke-width="1.6"/>
  <text x="370" y="472" font-size="13" fill="#1F2933" text-anchor="middle">逐 0.5 s 子窗：四重可信性门控</text>
  <text x="370" y="493" font-size="12.5" fill="#4A5568" text-anchor="middle">能量门 → 相关门 → 增益帽 → 声纹门（自一致性）</text>
  <text x="370" y="513" font-size="11.5" fill="#718096" text-anchor="middle">任一门不通过则该子窗不减：宁可不减，不可错减</text>
  <rect x="140" y="560" width="460" height="76" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="370" y="584" font-size="13" fill="#1F2933" text-anchor="middle">带符号增益对齐相减（逐子窗最小二乘）</text>
  <text x="370" y="604" font-size="12.5" fill="#4A5568" text-anchor="middle">γ = (ŝ, y) / (ŝ, ŝ)，中心插值 + 0.1 s 平滑 → γ(t)</text>
  <text x="370" y="624" font-size="12.5" fill="#4A5568" text-anchor="middle">r = y − γ(t)·ŝ</text>
  <rect x="140" y="676" width="460" height="52" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.6"/>
  <text x="370" y="707" font-size="12.5" fill="#1F2933" text-anchor="middle">维纳后滤波 g = |R|² / (|R|² + β|S|²)：压制目标残留</text>
  <rect x="140" y="764" width="460" height="56" rx="10" fill="#E9F7EE" stroke="#2F855A" stroke-width="1.6"/>
  <text x="370" y="787" font-size="13" fill="#1F2933" text-anchor="middle">输出：消除注册人，保留其他说话人</text>
  <text x="370" y="808" font-size="11.5" fill="#4A5568" text-anchor="middle">（两人重叠段逐样本保留）</text>

  <!-- 失效检测（红） -->
  <rect x="620" y="764" width="176" height="76" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.6"/>
  <text x="708" y="788" font-size="12.5" fill="#1F2933" text-anchor="middle">失效检测与告警</text>
  <text x="708" y="808" font-size="11.5" fill="#C53030" text-anchor="middle">能量塌缩 / 不降反升</text>
  <text x="708" y="826" font-size="11.5" fill="#C53030" text-anchor="middle">→ 切换替代路线</text>

  <!-- 左列箭头 -->
  <line x1="170" y1="124" x2="170" y2="152" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="163,141 177,141 170,152" fill="#94A3B8"/>
  <line x1="170" y1="208" x2="170" y2="236" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="163,225 177,225 170,236" fill="#94A3B8"/>

  <!-- 右列箭头 -->
  <line x1="565" y1="124" x2="565" y2="152" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,141 572,141 565,152" fill="#94A3B8"/>
  <line x1="565" y1="220" x2="565" y2="244" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,231 572,231 565,244" fill="#94A3B8"/>
  <line x1="565" y1="324" x2="565" y2="352" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,339 572,339 565,352" fill="#94A3B8"/>

  <!-- ŝ 汇入门控 -->
  <line x1="565" y1="408" x2="565" y2="444" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="558,433 572,433 565,444" fill="#94A3B8"/>
  <text x="578" y="432" font-size="12" fill="#2B6CB0" text-anchor="start">ŝ</text>

  <!-- 注册嵌入 r：条件注入提取网络（虚线） -->
  <line x1="300" y1="272" x2="424" y2="272" stroke="#2F855A" stroke-width="1.6" stroke-dasharray="6,5"/>
  <polygon points="424,266 424,278 434,272" fill="#2F855A"/>
  <text x="362" y="254" font-size="11.5" fill="#2F855A" text-anchor="middle" data-halo="1">注册嵌入 r</text>
  <text x="362" y="292" font-size="11" fill="#2F855A" text-anchor="middle" data-halo="1">条件注入，全程复用</text>

  <!-- 注册嵌入 r：声纹门参照（绕左侧，虚线） -->
  <polyline points="60,304 60,486 136,486" fill="none" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6,5"/>
  <polygon points="146,481 146,491 136,486" fill="#B7791F"/>
  <text x="66" y="400" font-size="11" fill="#B7791F" text-anchor="start" data-halo="1">声纹门参照</text>

  <!-- 混音 y 旁路（右侧绕行，虚线） -->
  <polyline points="695,98 740,98 740,598 604,598" fill="none" stroke="#718096" stroke-width="1.6" stroke-dasharray="6,5"/>
  <polygon points="614,593 614,603 604,598" fill="#718096"/>
  <text x="717" y="88" font-size="11" fill="#718096" text-anchor="middle" data-halo="1">y 旁路</text>

  <!-- 合并段主链箭头 -->
  <line x1="370" y1="524" x2="370" y2="556" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="363,545 377,545 370,556" fill="#94A3B8"/>
  <line x1="370" y1="636" x2="370" y2="672" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="363,661 377,661 370,672" fill="#94A3B8"/>
  <line x1="370" y1="728" x2="370" y2="760" stroke="#94A3B8" stroke-width="1.6"/>
  <polygon points="363,749 377,749 370,760" fill="#94A3B8"/>

  <!-- 输出 → 失效检测 -->
  <line x1="600" y1="792" x2="610" y2="792" stroke="#C53030" stroke-width="1.4" stroke-dasharray="5,4"/>
  <polygon points="610,787 610,797 618,792" fill="#C53030"/>
</svg>
