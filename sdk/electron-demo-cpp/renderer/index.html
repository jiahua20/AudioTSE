<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AudioTSE 声纹门控 Demo（C++ SDK）</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; height: 100vh;
    }
    header { padding: 10px 16px; border-bottom: 1px solid rgba(128,128,128,.35); }
    header h1 { font-size: 16px; margin: 0 0 4px; }
    #status { font-size: 12px; opacity: .75; }
    .controls { display: flex; gap: 10px; padding: 12px 16px; align-items: center; }
    button {
      font: inherit; padding: 6px 16px; border-radius: 6px; cursor: pointer;
      border: 1px solid rgba(128,128,128,.5); background: transparent;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #enrollBtn.recording { background: #d93025; color: #fff; border-color: #d93025; }
    #monitorBtn.on { background: #188038; color: #fff; border-color: #188038; }
    #log {
      flex: 1; overflow-y: auto; padding: 4px 16px 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .seg {
      display: grid; grid-template-columns: 64px 1fr 120px; gap: 10px; align-items: center;
      padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(128,128,128,.3);
    }
    .seg.accept { border-color: #188038; }
    .seg.reject { border-color: #d93025; opacity: .75; }
    .seg .tag { font-weight: 600; }
    .seg.accept .tag { color: #188038; }
    .seg.reject .tag { color: #d93025; }
    .bar { position: relative; height: 10px; border-radius: 5px; background: rgba(128,128,128,.25); }
    .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; width: 0; background: #8ab4f8; }
    .bar .thresh { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #f29900; }
    .meta { font-size: 12px; opacity: .8; text-align: right; }
  </style>
</head>
<body>
  <header>
    <h1>AudioTSE 声纹门控 Demo（C++ SDK）</h1>
    <div id="status">SDK 加载中……（首次需加载 VAD + 声纹模型）</div>
  </header>
  <div class="controls">
    <button id="enrollBtn" disabled>🎤 注册（说四个字）</button>
    <button id="monitorBtn" disabled>▶ 开始监听</button>
    <span id="hint" style="font-size:12px;opacity:.7"></span>
  </div>
  <div id="log"></div>
  <script src="app.js"></script>
</body>
</html>
